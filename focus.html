<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusLock - Stay Focused</title>
  <link rel="stylesheet" href="focus.css">
</head>
<body>
  <!-- Mountain background with overlay -->
  <div class="background-container"></div>
  
  <!-- Main content -->
  <div class="content-container">
    
    <!-- Greeting at top -->
    <div class="greeting-section" data-testid="greeting-section">
      <div class="greeting-text" data-testid="greeting-text">Good morning, User</div>
    </div>
    
    <!-- Mode tabs -->
    <div class="mode-tabs" data-testid="mode-tabs">
      <button class="mode-tab active" data-mode="focus" data-testid="focus-tab">
        <span class="tab-icon">🎯</span>
        <span>Focus</span>
      </button>
      <button class="mode-tab" data-mode="shortBreak" data-testid="short-break-tab">
        <span class="tab-icon">☕</span>
        <span>Short Break</span>
      </button>
      <button class="mode-tab" data-mode="longBreak" data-testid="long-break-tab">
        <span class="tab-icon">🌴</span>
        <span>Long Break</span>
      </button>
    </div>
    
    <!-- Focus topic display with quote -->
    <div class="focus-topic-display hidden" data-testid="focus-topic-display">
      <!-- Focus topic and quote will be displayed here -->
    </div>
    
    <!-- Large timer display -->
    <div class="timer-container" data-testid="timer-container">
      <div class="timer-display" data-testid="timer-display">25:00</div>
      <div class="timer-label" data-testid="timer-label">Focus Time</div>
    </div>
    
    <!-- Control buttons -->
    <div class="controls-container">
      <button class="control-btn start-btn" data-testid="start-button">
        <span class="btn-icon">▶</span>
        <span class="btn-text">Start</span>
      </button>
      <button class="control-btn pause-btn hidden" data-testid="pause-button">
        <span class="btn-icon">⏸</span>
        <span class="btn-text">Pause</span>
      </button>
      <button class="control-btn end-session-btn hidden" data-testid="end-session-button">
        <span class="btn-icon">⏹</span>
        <span class="btn-text">End Session</span>
      </button>
      <button class="control-btn-small reset-btn" data-testid="reset-button">
        <span>↻</span>
      </button>
    </div>
    
    <!-- Session counter -->
    <div class="session-counter" data-testid="session-counter">
      <span>Sessions completed: </span>
      <span class="session-count" data-testid="session-count">0</span>
    </div>
    
    <!-- Soundscape Player -->
    <div class="soundscape-container" data-testid="soundscape-container">
      <div class="soundscape-header">
        <span class="soundscape-icon">🎵</span>
        <span class="soundscape-title">Focus Soundscapes</span>
      </div>
      <div class="soundscape-controls">
        <select class="soundscape-selector" data-testid="soundscape-selector">
          <option value="none">No Sound</option>
          <option value="spring">Spring Sounds</option>
          <option value="birds-forest">Birds & Forest</option>
          <option value="nature-ambience">Nature Ambience</option>
          <option value="ocean-waves">Ocean Waves</option>
          <option value="relaxing-rain">Relaxing Rain</option>
        </select>
        <button class="soundscape-play-btn" data-testid="soundscape-play-btn">
          <span class="play-icon">▶</span>
        </button>
        <div class="volume-control">
          <input type="range" class="soundscape-volume" data-testid="soundscape-volume" min="0" max="100" value="50">
          <span class="volume-icon">🔊</span>
        </div>
      </div>
    </div>
    
    <!-- Task input section -->
    <div class="task-input-section" data-testid="task-input-section">
      <div class="input-row">
        <select class="subject-selector" data-testid="subject-selector">
          <option value="">Select Subject</option>
          <option value="Work">💼 Work</option>
          <option value="Study">📚 Study</option>
          <option value="Exercise">🏃 Exercise</option>
          <option value="Reading">📖 Reading</option>
          <option value="Writing">✍️ Writing</option>
          <option value="Other">📝 Other</option>
        </select>
        <input 
          type="text" 
          class="task-input" 
          placeholder="What are you focusing on?"
          data-testid="task-input"
        />
        <button class="add-task-btn" data-testid="add-task-button">+</button>
      </div>
    </div>
    
    <!-- Task cards -->
    <div class="tasks-container" data-testid="tasks-container">
      <!-- Task cards will be dynamically added here -->
    </div>
    
    <!-- Blocked site warning -->
    <div class="warning-message hidden" data-testid="warning-message">
      <div class="warning-icon">⚠️</div>
      <div class="warning-text">
        <strong>Focus Mode Active</strong>
        <p>This site is blocked during focus sessions. Stay focused!</p>
      </div>
    </div>
    
    <!-- Completion notification -->
    <div class="completion-notification hidden" data-testid="completion-notification">
      <div class="notification-icon">🎉</div>
      <div class="notification-text">
        <strong class="notification-title">Great job!</strong>
        <p class="notification-message">Session completed successfully!</p>
      </div>
    </div>
  </div>
  
  <script src="focus.js"></script>
</body>
</html>
